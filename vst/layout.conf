# Robovox MPC skin layout, five tabs:
#   VOICE    the carrier: waveform, pitch mode (FIXED, LATCH, MIDI, FOLLOW), root, chord, scale, octave, glide, spread
#   VOCODER  bands, shift, Q, release, sibilance, unvoiced, freeze
#   ROBOT    crush, ring modulator, stereo width, tempo-synced gate
#   IN/OUT   input channel, input gain, noise gate, mix, output
#   PRESETS  32 slots: knob + LOAD / SAVE (the slots are also the MPC preset list)
# Q-Links carry only knobs and option selectors, no buttons or switches.
# Palette: gunmetal with an acid-green LED readout.
style=td3
theme_bg=1e2226
theme_panel=1e2226
theme_line=0a0c0e
theme_ink=e4ece6
theme_ink_dim=93a19a
theme_ink_faint=56615b
theme_accent=7cff4f
theme_accent_hi=b4ff96
theme_knob_face=343a40
theme_knob_ring=060708
theme_bar=7cff4f
theme_seg_active=7cff4f
theme_seg_inactive=343a40
theme_seg_active_tx=0e1210
theme_btn_text=0e1210
theme_well=0a0c0e
theme_knob_off=4e555c
theme_tab_on=7cff4f
theme_tab_on_tx=0e1210
theme_lcd=0b1a0c
theme_box=121518
theme_btn_bg=2f6a24
theme_chrome_ink=e4ece6
theme_go_on=7cff4f
theme_go_off=ff5a3c
theme_tabs=7cff4f

[tab VOICE]
frame x=36 y=88 w=1207 h=624 title="CARRIER"
text cx=220 cy=150 label="CARRIER" size=2.2
popup cx=220 cy=200 w=260 h=48 label="" key=carrier
enum_h cx=640 cy=200 label="PITCH" key=pitch_mode sw=110
text cx=1060 cy=150 label="CHORD" size=2.2
popup cx=1060 cy=200 w=240 h=48 label="" key=chord
knob cx=180 cy=480 r=34 label="ROOT" key=root
text cx=430 cy=420 label="SCALE" size=2.2
popup cx=430 cy=470 w=240 h=48 label="" key=scale
knob cx=690 cy=480 r=34 label="OCTAVE" key=octave
knob cx=890 cy=480 r=34 label="GLIDE" key=glide
knob cx=1090 cy=480 r=34 label="SPREAD" key=spread
qlinks "VOICE" = carrier,pitch_mode,root,chord,scale,octave,glide,spread

[tab VOCODER]
frame x=36 y=88 w=1207 h=624 title="VOCODER"
enum_h cx=380 cy=200 label="BANDS" key=bands sw=90
toggle cx=960 cy=200 label="FREEZE" key=freeze
knob cx=170 cy=480 r=34 label="SHIFT" key=shift
knob cx=390 cy=480 r=34 label="Q" key=q
knob cx=610 cy=480 r=34 label="RELEASE" key=release
knob cx=830 cy=480 r=34 label="SIBILANCE" key=sibilance
knob cx=1050 cy=480 r=34 label="UNVOICED" key=unvoiced
qlinks "VOCODER" = bands,shift,q,release,sibilance,unvoiced

[tab ROBOT]
frame x=36 y=88 w=1207 h=624 title="ROBOT"
knob cx=240 cy=290 r=34 label="CRUSH" key=crush
knob cx=520 cy=290 r=34 label="RING" key=ring
knob cx=800 cy=290 r=34 label="WIDTH" key=width
enum_h cx=640 cy=540 label="GATE SYNC" key=tgate sw=110
qlinks "ROBOT" = crush,ring,width,tgate

[tab IN/OUT]
frame x=36 y=88 w=1207 h=624 title="INPUT / OUTPUT"
enum_h cx=360 cy=210 label="INPUT" key=input sw=120
knob cx=200 cy=480 r=34 label="IN GAIN" key=in_gain
knob cx=460 cy=480 r=34 label="NOISE GATE" key=gate
knob cx=760 cy=480 r=34 label="MIX" key=mix
knob cx=1040 cy=480 r=34 label="OUTPUT" key=output
qlinks "IN/OUT" = input,in_gain,gate,mix,output

[tab PRESETS]
frame x=36 y=88 w=1207 h=624 title="PRESETS"
knob cx=240 cy=300 r=34 label="PRESET" key=preset
button cx=600 cy=300 label="LOAD" key=preset_load
button cx=880 cy=300 label="SAVE" key=preset_save
text cx=640 cy=455 label="SLOT" size=2.2
readout cx=640 cy=520 w=640 h=64 label="" key=preset
qlinks "PRESETS" = preset
