# Robovox skin, Force-Look (1.1.0, as Rattler 1.1, Fader FX 1.2, V-Filter 0.7 and Wumms 0.3): large type, big touch
# targets, a colourful page of its own (gradient, glow, light rays, dark panels behind the controls), arc knobs, big
# option segments and buttons. force_look.py (vst.json "skin_post") repaints the generator's images and draws the
# #@title / #@frame / #@text lines (comments for the generator). Coordinates in shadow pixels (x 0-1280, y 86-714).
# Five tabs as before:
#   VOICE    the carrier: waveform, pitch mode (FIXED, LATCH, MIDI, FOLLOW), chord; root, scale, octave, glide, spread
#   VOCODER  bands, freeze; shift, Q, release, sibilance, unvoiced
#   ROBOT    crush, ring modulator, stereo width, tempo-synced gate
#   IN/OUT   input channel, input gain, noise gate, mix, output
#   PRESETS  32 slots: the knob only browses, LOAD and SAVE act (the slots are also the MPC preset list)
# Q-Links carry only knobs and option selectors, no buttons or switches (FREEZE is not on a Q-Link).
# A knob with an odd radius has a bipolar arc (from 12 o'clock): OCTAVE, SHIFT, OUTPUT.
# Colours: acid-green LED on dark gunmetal (each plugin its own colours).
style=plain
font_label=fonts/DejaVuSans-Bold.ttf
label_scale=1.5
scale_names=1
theme_bg=1c2824
theme_panel=1c2824
theme_box=1c2824
theme_ink=ffffff
theme_ink_dim=b4ff96
theme_accent=7cff4f
theme_accent_hi=ffffff
theme_lcd=08120a
theme_ink_faint=1c2824
#@look bg_top=0a0e10 bg_bottom=1c2824 glow=3cff6a ray1=7cff4f ray2=1f7a52 ray_alpha=30 panel=060a08 frame=7cff4f frame_text=0a0e10 title=ffffff sub=b4ff96 text=eefff0 knob_face=18221e knob_rim=4f7a5a knob_track=22322a knob_arc=7cff4f pointer=ffffff slider_track=22322a slider_fill=7cff4f slider_cap=ffffff slider_cap_line=18221e btn=2a5a22 btn_ring=7cff4f btn_text=ffffff btn_down=7cff4f btn_down_text=0a0e10 seg=18221e seg_ring=4f7a5a seg_text=d8ffd0 seg_on=7cff4f seg_on_ring=ffffff seg_on_text=0a0e10 pill_off=18221e pill_on=7cff4f pill_dot=ffffff list=060a08 list_ring=7cff4f opt=18221e opt_text=eefff0 opt_on=7cff4f opt_on_text=0a0e10

[tab VOICE]
#@title text="VOICE" sub="ROBOVOX 1.1"
#@frame x=20 y=156 w=1240 h=270 title="CARRIER"
popup cx=175 cy=240 w=280 h=68 label="" key=carrier
#@text cx=175 cy=314 label="WAVE" size=29
enum_h cx=640 cy=240 label="" key=pitch_mode sw=140 sh=64
#@text cx=640 cy=314 label="PITCH" size=29
popup cx=1105 cy=240 w=280 h=68 label="" key=chord
#@text cx=1105 cy=314 label="CHORD" size=29
#@frame x=20 y=438 w=1240 h=262 title="PITCH"
knob cx=136 cy=522 r=52 label="ROOT" key=root
popup cx=382 cy=522 w=230 h=68 label="" key=scale
#@text cx=382 cy=596 label="SCALE" size=29
knob cx=640 cy=522 r=51 label="OCTAVE" key=octave
knob cx=898 cy=522 r=52 label="GLIDE" key=glide
knob cx=1144 cy=522 r=52 label="SPREAD" key=spread
qlinks "VOICE" = carrier,pitch_mode,root,chord,scale,octave,glide,spread

[tab VOCODER]
#@title text="VOCODER" sub="ROBOVOX 1.1"
#@frame x=20 y=156 w=1240 h=270 title="FILTER BANK"
enum_h cx=440 cy=240 label="" key=bands sw=120 sh=64
#@text cx=440 cy=314 label="BANDS" size=29
enum_h cx=1040 cy=240 label="" key=freeze sw=130 sh=64
#@text cx=1040 cy=314 label="FREEZE" size=29
#@frame x=20 y=438 w=1240 h=262 title="VOICE SHAPE"
knob cx=136 cy=522 r=51 label="SHIFT" key=shift
knob cx=382 cy=522 r=52 label="Q" key=q
knob cx=640 cy=522 r=52 label="RELEASE" key=release
knob cx=898 cy=522 r=52 label="SIBILANCE" key=sibilance
knob cx=1144 cy=522 r=52 label="UNVOICED" key=unvoiced
qlinks "VOCODER" = bands,shift,q,release,sibilance,unvoiced

[tab ROBOT]
#@title text="ROBOT" sub="ROBOVOX 1.1"
#@frame x=20 y=156 w=1240 h=270 title="COLOUR"
knob cx=240 cy=240 r=52 label="CRUSH" key=crush
knob cx=640 cy=240 r=52 label="RING" key=ring
knob cx=1040 cy=240 r=52 label="WIDTH" key=width
#@frame x=20 y=438 w=1240 h=262 title="GATE SYNC"
enum_h cx=640 cy=522 label="" key=tgate sw=150 sh=64
#@text cx=640 cy=596 label="TEMPO-SYNCED GATE" size=29
qlinks "ROBOT" = crush,ring,width,tgate

[tab IN/OUT]
#@title text="IN/OUT" sub="ROBOVOX 1.1"
#@frame x=20 y=156 w=1240 h=270 title="INPUT"
enum_h cx=330 cy=240 label="" key=input sw=150 sh=64
#@text cx=330 cy=314 label="CHANNEL" size=29
knob cx=795 cy=240 r=52 label="IN GAIN" key=in_gain
knob cx=1105 cy=240 r=52 label="NOISE GATE" key=gate
#@frame x=20 y=438 w=1240 h=262 title="OUTPUT"
knob cx=485 cy=522 r=52 label="MIX" key=mix
knob cx=795 cy=522 r=51 label="OUTPUT" key=output
qlinks "IN/OUT" = input,in_gain,gate,mix,output

[tab PRESETS]
#@title text="PRESETS" sub="ROBOVOX 1.1"
#@frame x=20 y=156 w=1240 h=554 title="32 SLOTS"
#@text cx=640 cy=230 label="REGLER WÄHLT DEN PLATZ · LOAD UND SAVE FÜHREN AUS" size=24 color=sub
button cx=240 cy=390 w=300 h=110 label="LOAD" key=preset_load
knob cx=640 cy=380 r=52 label="PRESET" key=preset
button cx=1040 cy=390 w=300 h=110 label="SAVE" key=preset_save
readout cx=640 cy=600 w=760 h=64 label="" key=preset
qlinks "PRESETS" = preset
